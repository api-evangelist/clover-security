aid: clover-security
name: Clover Security
description: 'Clover Security is a Tel Aviv-based product security company (founded 2023)
  that builds design-led AI security agents for the software development lifecycle. Its
  agents plug into the tools engineering teams already use — GitHub, Cursor, Confluence,
  Jira, and Slack — to automate security design reviews, run continuous threat modeling,
  detect design-to-implementation drift, and keep agentic and spec-driven development
  secure by default. Clover has raised $36M from Notable Capital, Team8, and Silicon
  Valley CISO Investments, serving enterprise, fintech, and banking customers including
  Lemonade, Plaid, Notion, Udemy, and ServiceTitan. This profile was surfaced as a
  portfolio company of ggv-capital and enriched from the company''s public web surface;
  Clover exposes no public developer API at this time.'
